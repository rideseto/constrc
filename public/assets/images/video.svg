<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="vidSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#vidSky)"/>
  <!-- Panoramic Skyline under Construction -->
  <polygon points="150,140 320,140 320,600 150,600" fill="#0284c7" opacity="0.85"/>
  <polygon points="360,80 580,80 580,600 360,600" fill="#0369a1" opacity="0.95"/>
  <polygon points="620,110 820,110 820,600 620,600" fill="#0284c7" opacity="0.85"/>
  <polygon points="860,180 1020,180 1020,600 860,600" fill="#0f172a" opacity="0.9"/>
  <!-- Tower Cranes -->
  <line x1="500" y1="80" x2="500" y2="20" stroke="#fbb900" stroke-width="4"/>
  <line x1="420" y1="20" x2="600" y2="20" stroke="#fbb900" stroke-width="3"/>
</svg>