<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="curtainGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#skyGrad3)"/>
  <!-- Perspective Skyscraper looking up -->
  <polygon points="320,40 500,40 680,600 240,600" fill="url(#curtainGlass)" opacity="0.95"/>
  <!-- Floor slab lines -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.4">
    <line x1="315" y1="80" x2="510" y2="80"/>
    <line x1="305" y1="130" x2="525" y2="130"/>
    <line x1="295" y1="190" x2="545" y2="190"/>
    <line x1="280" y1="260" x2="570" y2="260"/>
    <line x1="265" y1="340" x2="600" y2="340"/>
    <line x1="250" y1="430" x2="635" y2="430"/>
    <line x1="240" y1="530" x2="670" y2="530"/>
  </g>
  <!-- Vertical Mullion Fins (Gold) -->
  <line x1="370" y1="40" x2="380" y2="600" stroke="#fbb900" stroke-width="3" opacity="0.9"/>
  <line x1="420" y1="40" x2="470" y2="600" stroke="#fbb900" stroke-width="4" opacity="0.9"/>
  <line x1="460" y1="40" x2="560" y2="600" stroke="#fbb900" stroke-width="3" opacity="0.9"/>
  <!-- Secondary Tower left -->
  <polygon points="80,180 220,180 200,600 40,600" fill="#0f172a" opacity="0.8"/>
  <line x1="150" y1="180" x2="120" y2="600" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
</svg>