<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="workerSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="vestGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbb900"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="700" fill="url(#workerSky)"/>
  <!-- Scaffolding in Background -->
  <g stroke="#475569" stroke-width="2" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="700"/>
    <line x1="200" y1="0" x2="200" y2="700"/>
    <line x1="340" y1="0" x2="340" y2="700"/>
    <line x1="480" y1="0" x2="480" y2="700"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="80" y1="150" x2="200" y2="300"/>
    <line x1="200" y1="150" x2="80" y2="300"/>
    <line x1="340" y1="150" x2="480" y2="300"/>
    <line x1="480" y1="150" x2="340" y2="300"/>
  </g>
  <!-- Engineer Silhouette with Hardhat & Blueprint -->
  <g transform="translate(140, 160)">
    <!-- Hardhat -->
    <path d="M120,80 C120,40 200,40 200,80 L220,95 L100,95 Z" fill="#fbb900"/>
    <rect x="90" y="90" width="140" height="10" rx="3" fill="#d97706"/>
    <!-- Head / Face profile -->
    <path d="M130,95 C130,130 190,130 190,95 Z" fill="#e2e8f0" opacity="0.85"/>
    <!-- Neck -->
    <rect x="145" y="125" width="30" height="30" fill="#cbd5e1" opacity="0.8"/>
    <!-- Body / Shoulders with Safety Vest -->
    <path d="M80,180 C80,150 140,150 160,150 C180,150 240,150 240,180 L260,380 L60,380 Z" fill="#1e293b"/>
    <path d="M100,165 L140,165 L140,380 L100,380 Z" fill="url(#vestGrad)"/>
    <path d="M180,165 L220,165 L220,380 L180,380 Z" fill="url(#vestGrad)"/>
    <!-- Reflective Stripes -->
    <rect x="100" y="240" width="40" height="16" fill="#ffffff" opacity="0.9"/>
    <rect x="180" y="240" width="40" height="16" fill="#ffffff" opacity="0.9"/>
    <rect x="100" y="310" width="40" height="16" fill="#ffffff" opacity="0.9"/>
    <rect x="180" y="310" width="40" height="16" fill="#ffffff" opacity="0.9"/>
    <!-- Arms holding digital tablet / blueprint -->
    <path d="M70,220 L120,290 L160,260" stroke="#cbd5e1" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M250,220 L200,290 L160,260" stroke="#cbd5e1" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.9"/>
    <!-- Digital Tablet glowing blue -->
    <rect x="120" y="260" width="80" height="55" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="126" y="266" width="68" height="43" fill="#0284c7" opacity="0.65"/>
    <line x1="135" y1="278" x2="185" y2="278" stroke="#38bdf8" stroke-width="2"/>
    <line x1="135" y1="288" x2="175" y2="288" stroke="#38bdf8" stroke-width="2"/>
    <line x1="135" y1="298" x2="165" y2="298" stroke="#fbb900" stroke-width="2"/>
  </g>
</svg>