<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="100%" height="100%">
  <defs>
    <linearGradient id="svcSky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="700" height="500" fill="url(#svcSky1)"/>
  <!-- Steel Diagrid Frame Structure -->
  <g stroke="#fbb900" stroke-width="3.5" fill="none">
    <rect x="180" y="80" width="340" height="420" stroke="#64748b" stroke-width="4"/>
    <line x1="180" y1="80" x2="520" y2="220"/>
    <line x1="520" y1="80" x2="180" y2="220"/>
    <line x1="180" y1="220" x2="520" y2="360"/>
    <line x1="520" y1="220" x2="180" y2="360"/>
    <line x1="180" y1="360" x2="520" y2="500"/>
    <line x1="520" y1="360" x2="180" y2="500"/>
  </g>
  <!-- Floor Plates -->
  <g stroke="#38bdf8" stroke-width="2" opacity="0.6">
    <line x1="180" y1="150" x2="520" y2="150"/>
    <line x1="180" y1="290" x2="520" y2="290"/>
    <line x1="180" y1="430" x2="520" y2="430"/>
  </g>
  <!-- Crane Arm Hoisting I-Beam -->
  <line x1="280" y1="20" x2="620" y2="20" stroke="#fbb900" stroke-width="4"/>
  <line x1="440" y1="20" x2="440" y2="110" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="380" y="110" width="120" height="14" fill="#fbb900" rx="2"/>
  <text x="50" y="460" font-family="sans-serif" font-weight="800" font-size="28" fill="#ffffff" opacity="0.9">BUILDING CONSTRUCTION</text>
  <text x="50" y="485" font-family="sans-serif" font-size="16" fill="#fbb900">High-Strength Steel Diagrid & Slipform Core</text>
</svg>