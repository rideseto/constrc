<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="goldBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbb900"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glassWall" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#skyGrad1)"/>
  <!-- Sun Glow -->
  <circle cx="480" cy="120" r="140" fill="#fbb900" opacity="0.15" filter="blur(30px)"/>
  <!-- Distant Skyline -->
  <rect x="40" y="240" width="60" height="160" fill="#0f172a" opacity="0.5"/>
  <rect x="110" y="200" width="75" height="200" fill="#0f172a" opacity="0.6"/>
  <rect x="420" y="220" width="80" height="180" fill="#0f172a" opacity="0.5"/>
  <rect x="510" y="190" width="70" height="210" fill="#0f172a" opacity="0.6"/>
  <!-- Main High-rise Tower -->
  <polygon points="200,60 380,60 380,400 200,400" fill="url(#glassWall)"/>
  <!-- Diagrid Structural Trusses -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.45">
    <line x1="200" y1="60" x2="380" y2="130"/>
    <line x1="380" y1="60" x2="200" y2="130"/>
    <line x1="200" y1="130" x2="380" y2="200"/>
    <line x1="380" y1="130" x2="200" y2="200"/>
    <line x1="200" y1="200" x2="380" y2="270"/>
    <line x1="380" y1="200" x2="200" y2="270"/>
    <line x1="200" y1="270" x2="380" y2="340"/>
    <line x1="380" y1="270" x2="200" y2="340"/>
    <line x1="200" y1="340" x2="380" y2="400"/>
    <line x1="380" y1="340" x2="200" y2="400"/>
  </g>
  <!-- Window mullions vertical -->
  <line x1="245" y1="60" x2="245" y2="400" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <line x1="290" y1="60" x2="290" y2="400" stroke="#fbb900" stroke-width="2" opacity="0.6"/>
  <line x1="335" y1="60" x2="335" y2="400" stroke="#ffffff" stroke-width="1.5" opacity="0.3"/>
  <!-- Rooftop Spire & Solar Pergola -->
  <rect x="230" y="45" width="120" height="15" fill="url(#goldBeam)"/>
  <line x1="290" y1="10" x2="290" y2="45" stroke="#fbb900" stroke-width="4"/>
  <!-- Tower Crane on site -->
  <g stroke="#fbb900" stroke-width="2" fill="none">
    <line x1="160" y1="400" x2="160" y2="100"/>
    <line x1="172" y1="400" x2="172" y2="100"/>
    <!-- Lattice cross bracing -->
    <line x1="160" y1="360" x2="172" y2="320"/>
    <line x1="160" y1="320" x2="172" y2="360"/>
    <line x1="160" y1="280" x2="172" y2="240"/>
    <line x1="160" y1="240" x2="172" y2="280"/>
    <line x1="160" y1="200" x2="172" y2="160"/>
    <line x1="160" y1="160" x2="172" y2="200"/>
    <line x1="160" y1="120" x2="172" y2="100"/>
    <!-- Crane Jib & Counterjib -->
    <polygon points="120,95 166,75 270,95" fill="none" stroke="#fbb900" stroke-width="2"/>
    <line x1="110" y1="95" x2="280" y2="95" stroke="#fbb900" stroke-width="3"/>
    <line x1="230" y1="95" x2="230" y2="160" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="222" y="160" width="16" height="18" fill="#fbb900"/>
  </g>
  <!-- Foreground ground gradient -->
  <rect x="0" y="380" width="600" height="20" fill="#0f172a"/>
</svg>